server {
    listen 80;
    listen [::]:80;
    server_name localhost cdmgames.local;
    root /var/www/html/cdmgames/public;
    index index.php index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 100M;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cdmgames.local;
    root /var/www/html/cdmgames/public;
    index index.php index.html;

    ssl_certificate /etc/nginx/ssl/cdmgames.local.crt;
    ssl_certificate_key /etc/nginx/ssl/cdmgames.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location /storage {
        alias /var/www/html/storage/app/public;
        try_files $uri $uri/ /index.php?$query_string;
        expires max;
        access_log off;
    }

    client_max_body_size 100M;
}
