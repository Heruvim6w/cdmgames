version: "3.8"
services:
  app:
    container_name: cdmgames_app
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    restart: always
    working_dir: /var/www/html/cdmgames
    volumes:
      - ./:/var/www/html/cdmgames
      - ./xhprof:/php/xhprof/data
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      VIRTUAL_HOST: cdmgames.local
      VIRTUAL_PROTO: fastcgi
      VIRTUAL_PORT: 9000
      VIRTUAL_ROOT: /var/www/html/cdmgames/public
      WWWUSER: "1000"
      LARAVEL_SAIL: 1
      XDEBUG_MODE: "off"
      XDEBUG_CONFIG: "client_host=host.docker.internal"
    ports:
      - "3030:3029"
      - "3031:3032"
    extra_hosts:
      - "cdmgames.local:172.17.0.1"
      - "host.docker.internal:host-gateway"
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: cdmgames_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
      - ./:/var/www/html/cdmgames
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: cdmgames_db
      MYSQL_USER: user
      MYSQL_PASSWORD: user_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot_password"]
      retries: 3
      timeout: 5s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "8087:80"
    depends_on:
      - mysql

volumes:
  mysql_data:
